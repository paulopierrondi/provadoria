<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Print harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    body { font-family: 'Inter', -apple-system, system-ui, sans-serif; width: max-content; min-width: 0; }
    * { box-sizing: border-box; }
    img, svg { display: block; }
    #root { display: inline-block; transform-origin: top left; }
  </style>
  <script>
    // Apply scale-to-fit BEFORE React mounts so screenshots capture the
    // properly-sized artboard. React doesn't touch #root's inline style.
    (function applyFit() {
      const params = new URLSearchParams(window.location.search);
      const screen = params.get('screen') || 'home';
      const sizes = {
        foundations: [1200, 760],
        landing: [1440, 4600],
      };
      const [w, h] = sizes[screen] || [402, 874];
      window.__artW = w; window.__artH = h; window.__artScreen = screen;
      function go() {
        const r = document.getElementById('root');
        if (!r) { requestAnimationFrame(go); return; }
        const vw = window.innerWidth, vh = window.innerHeight;
        let s;
        if (screen === 'landing') {
          // Fit width only — page is tall, capture chunks.
          s = Math.min(1, vw / w);
        } else {
          s = Math.min(vw / w, vh / h);
        }
        r.style.transform = `scale(${s})`;
        r.style.width = w + 'px';
        // For landing, let the inner content drive height (true page length).
        if (screen === 'landing') {
          // Don't constrain height — measure after render.
          const inner = r.firstElementChild;
          const realH = inner ? inner.scrollHeight : h;
          r.style.height = realH + 'px';
          document.body.style.width = (w * s) + 'px';
          document.body.style.height = (realH * s) + 'px';
          document.body.style.overflow = 'visible';
          document.documentElement.style.overflow = 'visible';
          window.__realH = realH;
        } else {
          r.style.height = h + 'px';
          document.body.style.width = (w * s) + 'px';
          document.body.style.height = (h * s) + 'px';
          document.body.style.overflow = 'hidden';
          document.documentElement.style.overflow = 'hidden';
        }
        window.__scale = s;
      }
      // Apply on load AND keep re-applying every 200ms for the first 2s
      // to defeat any late React render or font-load layout shift.
      window.addEventListener('load', () => {
        let n = 0;
        const tick = () => { go(); if (++n < 10) setTimeout(tick, 200); };
        tick();
      });
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/foundations.jsx"></script>
  <script type="text/babel" src="src/landing.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <script type="text/babel">
    // Match canvas.jsx palette exactly so screenshots match.
    const PALETTES = {
      cherry: { label:'Cherry · tomato red',  bone:'#F8DCD0', paper:'#FCE7DC', ink:'#1A0E0A', mid:'#8C6A5C', line:'rgba(26,14,10,0.14)',  accent:'#E63923', accentDeep:'#9F1F12' },
      mocha:  { label:'Mocha · butter accent',bone:'#E2CDAA', paper:'#EFDEC0', ink:'#2E1F14', mid:'#8B7560', line:'rgba(46,31,20,0.14)',  accent:'#D89A2F', accentDeep:'#7E5311' },
      butter: { label:'Butter · tomato accent',bone:'#F1DE8E',paper:'#F8E9A8', ink:'#1A140A', mid:'#7D6F4E', line:'rgba(26,20,10,0.16)',  accent:'#FF4A3D', accentDeep:'#A1241A' },
      pink:   { label:'Electric pink',        bone:'#FBDADF', paper:'#FEE9EC', ink:'#1A0A10', mid:'#8A5A68', line:'rgba(26,10,16,0.12)',  accent:'#FF3D7F', accentDeep:'#B0184E' },
      lime:   { label:'Bottega lime',         bone:'#E8E8B8', paper:'#F0EFC8', ink:'#141408', mid:'#6F7050', line:'rgba(20,20,8,0.14)',   accent:'#B7E635', accentDeep:'#5C7A12' },
      noir:   { label:'Noir · gold accent',   bone:'#15120E', paper:'#1E1A15', ink:'#F2EBDE', mid:'#8A8278', line:'rgba(242,235,222,0.14)', accent:'#C9925A', accentDeep:'#7E5311' },
    };
    const TYPEFACES = {
      'serif-instrument': { serif:'"Instrument Serif", "Times New Roman", serif', sans:'"Inter", -apple-system, system-ui, sans-serif', mono:'"JetBrains Mono", ui-monospace, monospace' },
    };

    function PhoneShell({ children, tokens }) {
      return (
        <div style={{
          width: 402, height: 874, background: tokens.bone, position: 'relative',
          overflow: 'hidden', color: tokens.ink,
        }}>
          <div style={{
            height: 54, padding: '18px 28px 0', display: 'flex',
            justifyContent: 'space-between', alignItems: 'center',
            fontFamily: '-apple-system, system-ui', fontSize: 17, fontWeight: 600,
            color: tokens.ink, position: 'relative', zIndex: 5,
          }}>
            <span>9:41</span>
            <div style={{
              position: 'absolute', left: '50%', top: 10, transform: 'translateX(-50%)',
              width: 124, height: 36, borderRadius: 18, background: '#000',
            }}/>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <svg width="18" height="11" viewBox="0 0 18 11">
                <rect x="0" y="7" width="3" height="4" rx=".5" fill={tokens.ink}/>
                <rect x="5" y="5" width="3" height="6" rx=".5" fill={tokens.ink}/>
                <rect x="10" y="3" width="3" height="8" rx=".5" fill={tokens.ink}/>
                <rect x="15" y="0" width="3" height="11" rx=".5" fill={tokens.ink}/>
              </svg>
              <svg width="24" height="12" viewBox="0 0 24 12">
                <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke={tokens.ink} strokeOpacity=".4" fill="none"/>
                <rect x="2" y="2" width="14" height="8" rx="1.5" fill={tokens.ink}/>
              </svg>
            </div>
          </div>
          <div style={{ position: 'absolute', inset: '54px 0 0', overflow: 'hidden' }}>
            {children}
          </div>
          <div style={{
            position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
            width: 134, height: 5, borderRadius: 3, background: tokens.ink, opacity: 0.85,
          }}/>
        </div>
      );
    }

    function App() {
      const params = new URLSearchParams(window.location.search);
      const screen = params.get('screen') || 'home';
      const paletteKey = params.get('palette') || 'cherry';
      const tokens = { ...PALETTES[paletteKey], ...TYPEFACES['serif-instrument'] };

      if (screen === 'foundations') return <window.Foundations tokens={tokens} />;
      if (screen === 'landing')     return <window.Landing tokens={tokens} />;

      const ScreenMap = {
        home: window.HomeScreen,
        capture: window.CaptureScreen,
        result: window.ResultScreen,
        saved: window.SavedScreen,
        profile: window.ProfileScreen,
      };
      const ScreenComp = ScreenMap[screen] || window.HomeScreen;
      return <PhoneShell tokens={tokens}><ScreenComp t={tokens} /></PhoneShell>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
